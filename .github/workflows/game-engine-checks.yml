name: Game engine checks

on:
  push:
    branches:
      - master
      - fix/engine-stability
      - fusion-de-ramas
      - audit/corregir-fallos-ci
  pull_request:
    branches:
      - master
      - fusion-de-ramas

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run ESLint
        run: npm run lint -- --max-warnings=0
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Functions
        run: deno check supabase/functions/room-lifecycle/index.ts supabase/functions/validate-action/index.ts
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
